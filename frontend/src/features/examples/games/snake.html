<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Змейка</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#14181f;color:#e8ecf2;
    font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;touch-action:none;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  #wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;touch-action:none}
  #hud{display:flex;gap:24px;justify-content:center;align-items:center;height:48px;font-size:18px;font-weight:600}
  #hud span b{color:#8be36b}
  #board{flex:1;display:flex;align-items:center;justify-content:center;width:100%;min-height:0}
  canvas{display:block;border-radius:10px;box-shadow:0 0 0 2px #2a3240;touch-action:none}
  #overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(10,13,18,.72);text-align:center;padding:16px;gap:12px}
  #overlay h1{margin:0;font-size:40px}
  #overlay p{margin:0;font-size:17px;opacity:.85;line-height:1.45}
  #overlay .btn{margin-top:8px;padding:14px 32px;border-radius:999px;background:#8be36b;color:#14181f;
    font-weight:700;font-size:20px}
  .hidden{display:none!important}
  #pause{position:fixed;top:8px;right:10px;width:36px;height:36px;border-radius:8px;background:#232a36;
    display:flex;align-items:center;justify-content:center;font-size:16px}
</style>
</head>
<body>
<div id="wrap">
  <div id="hud"><span>Счёт: <b id="score">0</b></span><span>Рекорд: <b id="best">0</b></span></div>
  <div id="board"><canvas id="c"></canvas></div>
</div>
<div id="pause">❚❚</div>
<div id="overlay">
  <h1 id="ttl">🐍 Змейка</h1>
  <p id="msg">Свайп в любую сторону поворачивает змейку.<br>На компьютере: стрелки или WASD, пробел — пауза.</p>
  <div class="btn" id="go">Играть</div>
</div>
<script>
(function(){
  const cv=document.getElementById('c'),ctx=cv.getContext('2d');
  const board=document.getElementById('board');
  const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best');
  const ov=document.getElementById('overlay'),ttl=document.getElementById('ttl'),msg=document.getElementById('msg'),go=document.getElementById('go');
  const pauseBtn=document.getElementById('pause');

  let COLS=18,ROWS=24,cell=20;
  let snake,dir,queue,food,score,best=0,state='menu',stepMs,acc=0,last=0,eatAnim=0;
  try{best=+localStorage.getItem('snake-best')||0}catch(e){}
  bestEl.textContent=best;

  function pickGrid(){
    const w=board.clientWidth||window.innerWidth,h=board.clientHeight||window.innerHeight-48;
    COLS=18;ROWS=Math.max(14,Math.min(32,Math.round(COLS*h/w)));
    if(w>h){ROWS=18;COLS=Math.max(18,Math.min(32,Math.round(ROWS*w/h)));}
  }
  function fit(){
    const w=board.clientWidth-16,h=board.clientHeight-16;
    cell=Math.max(8,Math.floor(Math.min(w/COLS,h/ROWS)));
    const dpr=window.devicePixelRatio||1;
    cv.style.width=cell*COLS+'px';cv.style.height=cell*ROWS+'px';
    cv.width=cell*COLS*dpr;cv.height=cell*ROWS*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    draw();
  }
  window.addEventListener('resize',fit);

  function placeFood(){
    const free=[];
    for(let x=0;x<COLS;x++)for(let y=0;y<ROWS;y++)
      if(!snake.some(s=>s.x===x&&s.y===y))free.push({x,y});
    food=free.length?free[(Math.random()*free.length)|0]:null;
  }
  function reset(){
    pickGrid();fit();
    const cx=COLS>>1,cy=ROWS>>1;
    snake=[{x:cx,y:cy},{x:cx,y:cy+1},{x:cx,y:cy+2}];
    dir={x:0,y:-1};queue=[];score=0;stepMs=150;acc=0;
    scoreEl.textContent=0;placeFood();
  }

  function turn(nx,ny){
    if(state==='menu'||state==='over'){start();}
    if(state==='paused'){state='play';}
    const ref=queue.length?queue[queue.length-1]:dir;
    if((nx===-ref.x&&ny===-ref.y)||(nx===ref.x&&ny===ref.y))return;
    if(queue.length<3)queue.push({x:nx,y:ny});
  }

  // звук
  let ac=null;
  function beep(f,d,type){
    try{
      ac=ac||new (window.AudioContext||window.webkitAudioContext)();
      const o=ac.createOscillator(),g=ac.createGain();
      o.type=type||'square';o.frequency.value=f;
      g.gain.setValueAtTime(.08,ac.currentTime);
      g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);
      o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d);
    }catch(e){}
  }

  function step(){
    if(queue.length)dir=queue.shift();
    const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
    const willEat=food&&h.x===food.x&&h.y===food.y;
    const body=willEat?snake:snake.slice(0,-1);
    if(h.x<0||h.y<0||h.x>=COLS||h.y>=ROWS||body.some(s=>s.x===h.x&&s.y===h.y)){return over();}
    snake.unshift(h);
    if(willEat){
      score++;scoreEl.textContent=score;eatAnim=1;
      stepMs=Math.max(65,150-score*3);
      beep(660+score*8,.09);
      placeFood();
      if(!food)return over(true);
    }else snake.pop();
  }

  function over(win){
    state='over';
    beep(win?880:140,.35,win?'triangle':'sawtooth');
    if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem('snake-best',best)}catch(e){}}
    ttl.textContent=win?'Победа! 🏆':'Игра окончена';
    msg.innerHTML='Счёт: <b>'+score+'</b> · Рекорд: <b>'+best+'</b>';
    go.textContent='Ещё раз';
    ov.classList.remove('hidden');
  }
  function start(){
    reset();state='play';ov.classList.add('hidden');last=performance.now();
  }
  function togglePause(){
    if(state==='play'){state='paused';ttl.textContent='Пауза';msg.textContent='Свайп или тап, чтобы продолжить';go.textContent='Продолжить';ov.classList.remove('hidden');}
    else if(state==='paused'){state='play';ov.classList.add('hidden');last=performance.now();}
  }

  function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h);ctx.fill();}
  function draw(){
    const W=cell*COLS,H=cell*ROWS;
    ctx.fillStyle='#1b212b';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#1f2631';
    for(let x=0;x<COLS;x++)for(let y=0;y<ROWS;y++)if((x+y)&1)ctx.fillRect(x*cell,y*cell,cell,cell);
    if(!snake)return;
    if(food){
      const p=1+Math.sin(performance.now()/180)*.08;
      ctx.fillStyle='#ff5d5d';ctx.beginPath();
      ctx.arc(food.x*cell+cell/2,food.y*cell+cell/2,cell*.38*p,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#6fcf4a';ctx.fillRect(food.x*cell+cell*.47,food.y*cell+cell*.05,cell*.1,cell*.22);
    }
    const n=snake.length;
    for(let i=n-1;i>=0;i--){
      const s=snake[i],t=i/Math.max(1,n-1);
      ctx.fillStyle=`hsl(${100-t*30},${65-t*15}%,${58-t*18}%)`;
      const pad=i===0?cell*.04:cell*.1;
      rr(s.x*cell+pad,s.y*cell+pad,cell-pad*2,cell-pad*2,cell*.3);
    }
    // глаза
    const hd=snake[0],cx=hd.x*cell+cell/2,cy=hd.y*cell+cell/2;
    const px=-dir.y,py=dir.x,off=cell*.2,fw=cell*.12;
    ctx.fillStyle='#fff';
    for(const k of[-1,1]){ctx.beginPath();ctx.arc(cx+px*off*k+dir.x*fw,cy+py*off*k+dir.y*fw,cell*.12,0,7);ctx.fill();}
    ctx.fillStyle='#111';
    for(const k of[-1,1]){ctx.beginPath();ctx.arc(cx+px*off*k+dir.x*fw*1.6,cy+py*off*k+dir.y*fw*1.6,cell*.06,0,7);ctx.fill();}
    if(eatAnim>0){ctx.strokeStyle=`rgba(139,227,107,${eatAnim})`;ctx.lineWidth=3;ctx.strokeRect(1.5,1.5,W-3,H-3);}
  }

  function loop(t){
    const dt=Math.min(250,t-last);last=t;
    if(state==='play'){acc+=dt;while(acc>=stepMs&&state==='play'){acc-=stepMs;step();}}
    eatAnim=Math.max(0,eatAnim-dt/300);
    draw();
    requestAnimationFrame(loop);
  }

  // клавиатура
  const keys={ArrowUp:[0,-1],KeyW:[0,-1],ArrowDown:[0,1],KeyS:[0,1],ArrowLeft:[-1,0],KeyA:[-1,0],ArrowRight:[1,0],KeyD:[1,0]};
  window.addEventListener('keydown',e=>{
    const k=keys[e.code];
    if(k){e.preventDefault();turn(k[0],k[1]);return;}
    if(e.code==='Space'||e.code==='KeyP'||e.code==='Escape'){e.preventDefault();if(state==='play'||state==='paused')togglePause();else start();}
    if(e.code==='Enter'&&state!=='play')start();
  });

  // свайпы
  let sx=0,sy=0,tracking=false,swiped=false;
  const TH=24;
  function onStart(x,y){sx=x;sy=y;tracking=true;swiped=false;}
  function onMove(x,y){
    if(!tracking)return;
    const dx=x-sx,dy=y-sy;
    if(Math.abs(dx)<TH&&Math.abs(dy)<TH)return;
    if(Math.abs(dx)>Math.abs(dy))turn(dx>0?1:-1,0);else turn(0,dy>0?1:-1);
    sx=x;sy=y;swiped=true; // можно вести палец дальше и поворачивать снова
  }
  function onEnd(){
    if(tracking&&!swiped&&state!=='play')(state==='paused'?togglePause():start());
    tracking=false;
  }
  document.addEventListener('touchstart',e=>{
    if(e.target===pauseBtn)return;
    const t=e.changedTouches[0];onStart(t.clientX,t.clientY);e.preventDefault();
  },{passive:false});
  document.addEventListener('touchmove',e=>{const t=e.changedTouches[0];onMove(t.clientX,t.clientY);e.preventDefault();},{passive:false});
  document.addEventListener('touchend',e=>{onEnd();e.preventDefault();},{passive:false});
  // мышь: перетаскивание тоже работает как свайп
  document.addEventListener('mousedown',e=>{if(e.target!==pauseBtn)onStart(e.clientX,e.clientY);});
  document.addEventListener('mousemove',e=>{if(e.buttons)onMove(e.clientX,e.clientY);});
  document.addEventListener('mouseup',onEnd);
  pauseBtn.addEventListener('click',togglePause);
  pauseBtn.addEventListener('touchend',e=>{e.preventDefault();e.stopPropagation();togglePause();});

  pickGrid();fit();
  snake=null;
  requestAnimationFrame(t=>{last=t;loop(t);});
})();
</script>
</body>
</html>
